name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ANA
        run: |
          A=https://telemetriaws1.ana.gov.br/ServiceANA.asmx
          d1=$(TZ=America/Sao_Paulo date -d yesterday +%d/%m/%Y); d2=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
          echo "range $d1 $d2" > ana2.txt
          for c in 02651096 02651097 02652116 02652117 02652118 02653010 02653067 02653084 02653085 02653086 02653087 02653088 02751066 02751098 02751099 02751100 02752088 02752089 02851072 65944900 65948000 65950200 65955000 65981510 65990550 72460000 72580500 72715000 72810000 72849000 72920000 73069960 73070000 73070040 73070070 73070150 73182000 73205750 73205800 73371000 73444700 73444750 73600020 73770000 73825000 73825330 73900000 73960000 74087500 74100000 74100300 74186000 74189000 74240000 74295000 74300000 74329000 74361000 74460000 74462500 74500000 75020200 75180500 86342000 86529500 ; do
            curl -s -m 40 "$A/DadosHidrometeorologicos?codEstacao=$c&dataInicio=$d1&dataFim=$d2" -o d.xml
            python3 -c "
          import re,sys
          x=open('d.xml',encoding='utf-8',errors='ignore').read()
          rows=re.findall(r'<DadosHidrometereologicos [^>]*>(.*?)</DadosHidrometereologicos>',x,re.S)
          def f(r,t):
              m=re.search('<'+t+'>([^<]*)</'+t+'>',r); return (m.group(1).strip() if m else '')
          n=len(rows); lv=sum(1 for r in rows if f(r,'Nivel')); ch=sum(1 for r in rows if f(r,'Chuva')); vz=sum(1 for r in rows if f(r,'Vazao'))
          last=rows[0] if rows else ''
          print('$c', 'n',n,'nivel',lv,'chuva',ch,'vazao',vz,'| last',f(last,'DataHora'),f(last,'Nivel'),f(last,'Chuva'),f(last,'Vazao'),'| bytes',len(x))
          " >> ana2.txt
          done
      - name: Salvar
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f ana2.txt; git commit -m "diag14 [skip ci]"; git push
