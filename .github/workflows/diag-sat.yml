name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raios
        run: |
          R=https://realearth.ssec.wisc.edu
          for q in GLM glm lightning LTG; do echo "== search $q" >> raios.txt; curl -s -m 30 "$R/api/products?search=$q" | head -c 4000 >> raios.txt; echo >> raios.txt; done
          echo "== gibs" >> raios.txt
          curl -s -m 60 "https://gibs.earthdata.nasa.gov/wmts/epsg3857/nrt/1.0.0/WMTSCapabilities.xml" | grep -oiE "<ows:Identifier>[^<]*(GLM|Lightning)[^<]*</ows:Identifier>" | sort -u | head -20 >> raios.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f raios.txt; git commit -m "diag8 [skip ci]"; git push
