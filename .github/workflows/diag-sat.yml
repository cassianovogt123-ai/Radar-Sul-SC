name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx vite build
      - name: Screenshot satélite
        run: |
          cd dist && (python3 -m http.server 4173 >/dev/null 2>&1 &) && cd ..
          mkdir -p /tmp/pp && cd /tmp/pp && npm init -y >/dev/null && npm i puppeteer-core >/dev/null
          cat > s.js <<'JS'
          const p=require('puppeteer-core');
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const pg=await b.newPage(); await pg.setViewport({width:430,height:860,deviceScaleFactor:1});
          const log=[]; pg.on('console',m=>log.push(m.text())); pg.on('requestfailed',r=>log.push('FAIL '+r.url().slice(0,160)+' '+r.failure().errorText));
          pg.on('response',r=>{if(/gibs/.test(r.url())) log.push(r.status()+' '+r.url().slice(0,200));});
          await pg.goto('http://localhost:4173/',{waitUntil:'networkidle2',timeout:60000}).catch(e=>log.push('goto '+e.message));
          await pg.evaluate(()=>[...document.querySelectorAll('button')].find(x=>/Satélite GOES/.test(x.textContent)).click());
          await new Promise(r=>setTimeout(r,20000));
          await pg.screenshot({path:process.env.GITHUB_WORKSPACE+'/sat_phone.png'});
          await pg.setViewport({width:1280,height:800}); await new Promise(r=>setTimeout(r,8000));
          await pg.screenshot({path:process.env.GITHUB_WORKSPACE+'/sat_desktop.png'});
          require('fs').writeFileSync(process.env.GITHUB_WORKSPACE+'/sat_log.txt',log.join('\n')); await b.close();})();
          JS
          node s.js
      - name: Salvar
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f sat_phone.png sat_desktop.png sat_log.txt; git commit -m "diag shots [skip ci]"; git push
