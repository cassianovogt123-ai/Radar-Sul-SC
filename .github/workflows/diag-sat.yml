name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probes
        run: |
          exec > >(tee diag5.txt) 2>&1
          set +e
          B=https://idapfile.mdr.gov.br/idap/api/rss/cap
          curl -s -m 60 --compressed -o /dev/null -w "gzip: %{size_download} bytes  %{http_code}\n" -H "Accept-Encoding: gzip" "$B"
          curl -s -m 60 -D - -o /dev/null -H "Accept-Encoding: gzip, br" "$B" | grep -i "content-encoding\|content-length\|access-control\|cache"
          curl -s -m 30 -X OPTIONS -D - -o /dev/null -H "Origin: https://localhost" -H "Access-Control-Request-Method: GET" "$B" | head -12
          for q in "?uf=SC" "/SC" "?estado=SC" "?limit=5"; do curl -s -m 60 -o /dev/null -w "$q -> %{http_code} %{size_download}\n" "$B$q"; done
          for u in https://idapfile.mdr.gov.br/idap/api/rss https://idapfile.mdr.gov.br/idap/api/ https://idapfile.mdr.gov.br/idap/api/rss/cap/uf/SC https://idapfile.mdr.gov.br/idap/api/alertas https://idapfile.mdr.gov.br/idap/swagger-ui.html https://idapfile.mdr.gov.br/idap/v3/api-docs; do curl -s -m 30 -o r.txt -w "$u -> %{http_code} %{content_type} %{size_download}\n" "$u"; head -c 300 r.txt; echo; done
          echo "=== INMET"
          for u in https://apiprevmet3.inmet.gov.br/avisos/ativos https://apiprevmet3.inmet.gov.br/avisos/rss https://alertas2.inmet.gov.br/; do curl -s -m 40 -D h.txt -o r.txt -w "$u -> %{http_code} %{content_type} %{size_download} err=%{errormsg}\n" "$u" -H "Origin: https://localhost"; grep -i access-control h.txt; head -c 400 r.txt; echo; done
      - name: Salvar
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f diag5.txt; git commit -m "diag5 [skip ci]"; git push
