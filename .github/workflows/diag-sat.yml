name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SIFAP imagem
        run: |
          B="https://sifap.defesacivil.sc.gov.br/radarsc/rest/radar"
          curl -sk -m 30 "$B/getUltimasImagens?prod=0&radar=CHP&data=" > lista.json
          head -c 600 lista.json > sifap_img.txt; echo >> sifap_img.txt
          name=$(python3 -c "import json;d=json.load(open('lista.json'));print(d[-1] if isinstance(d[-1],str) else d[-1].get('nome') or d[-1])")
          echo "name $name" >> sifap_img.txt
          for path in "getImagem?prod=0&radar=CHP&file=$name"; do
            curl -sk -m 30 -o img.bin -w "$path %{http_code} %{content_type} %{size_download}\n" -H "Referer: https://sifap.defesacivil.sc.gov.br/radarsc/" "$B/$path" >> sifap_img.txt
            if file img.bin | grep -qi image; then echo "== IMG" >> sifap_img.txt; base64 -w0 img.bin >> sifap_img.txt; echo >> sifap_img.txt; break; fi
          done
      - name: Salvar
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f sifap_img.txt; git commit -m "diag15 [skip ci]"; git push
