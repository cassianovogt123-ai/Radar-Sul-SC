name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vento
        run: |
          python3 -c "
          N=8;s,n,w,e=-31.5,-23.5,-58.5,-48.5
          la=[f'{s+(n-s)*i/(N-1):.2f}' for i in range(N) for j in range(N)]; lo=[f'{w+(e-w)*j/(N-1):.2f}' for i in range(N) for j in range(N)]
          print('https://api.open-meteo.com/v1/forecast?latitude='+','.join(la)+'&longitude='+','.join(lo)+'&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=kmh&timezone=UTC')" > url.txt
          curl -s -m 60 -D h.txt -H "Origin: https://localhost" "$(cat url.txt)" -o vento.json
          { head -1 h.txt; grep -i access-control h.txt; wc -c < vento.json; } > p.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f p.txt vento.json; git commit -m "diag19 [skip ci]"; git push
