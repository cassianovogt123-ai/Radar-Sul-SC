name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raios
        run: |
          R=https://realearth.ssec.wisc.edu
          t=$(curl -s "$R/api/times?products=glmgroupdensity" | python3 -c "import json,sys;d=json.load(sys.stdin);print(list(d.values())[0][-1])")
          echo "time $t" > raios.txt
          d=${t%%.*}; h=${t##*.}
          for zxy in 5/11/18 6/22/36 4/5/9; do f=t_$(echo $zxy|tr / _).png; curl -s -o $f "$R/tiles/glmgroupdensity/$d/$h/$zxy.png"; echo "== $f $(wc -c < $f)" >> raios.txt; base64 -w0 $f >> raios.txt; echo >> raios.txt; done
          curl -s -I "$R/tiles/glmgroupdensity/$d/$h/5/11/18.png" | grep -i "access-control\|content-type" >> raios.txt || true
      - name: Salvar
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f raios.txt; git commit -m "diag12 [skip ci]"; git push
