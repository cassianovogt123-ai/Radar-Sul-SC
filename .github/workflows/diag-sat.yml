name: diag-satelite
on:
  push:
    branches: [diag-satelite]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx vite build
      - name: Probes
        run: |
          exec > >(tee diag3.txt) 2>&1
          echo NOW $(date -u +%FT%TZ)
          curl -s "https://realearth.ssec.wisc.edu/api/times?products=G19-ABI-FD-BAND13" | python3 -c "import json,sys;t=json.load(sys.stdin)['G19-ABI-FD-BAND13'];print('RE last',t[-3:])"
          for z in "6/22/37" "7/44/74" "8/89/149" "9/178/298"; do curl -s -o /dev/null -w "RE z$z %{http_code} %{content_type} %{size_download}\n" "https://realearth.ssec.wisc.edu/tiles/G19-ABI-FD-BAND13/$z.png"; done
          for z in "7/44/74" "8/89/149" "9/178/298"; do curl -s -o /dev/null -w "RE B02 z$z %{http_code} %{content_type} %{size_download}\n" "https://realearth.ssec.wisc.edu/tiles/G19-ABI-FD-BAND02/$z.png"; done
      - name: Screenshot
        run: |
          cd dist && (python3 -m http.server 4173 >/dev/null 2>&1 &) && cd ..
          mkdir -p /tmp/pp && cd /tmp/pp && npm init -y >/dev/null && npm i puppeteer-core >/dev/null
          cat > s.js <<'JS'
          const p=require('puppeteer-core');
          (async()=>{const b=await p.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const pg=await b.newPage(); await pg.setViewport({width:430,height:860});
          const log=[]; pg.on('console',m=>log.push(m.text())); pg.on('requestfailed',r=>log.push('FAIL '+r.url().slice(0,170)+' '+r.failure().errorText));
          await pg.goto('http://localhost:4173/',{waitUntil:'networkidle2',timeout:60000}).catch(e=>log.push('goto '+e.message));
          await pg.screenshot({path:process.env.GITHUB_WORKSPACE+'/radar_dark0.png'});
          await pg.evaluate(()=>[...document.querySelectorAll('button')].find(x=>/^Escuro$/.test(x.textContent.trim())).click());
          await new Promise(r=>setTimeout(r,5000));
          await pg.screenshot({path:process.env.GITHUB_WORKSPACE+'/radar_dark.png'});
          await pg.evaluate(()=>[...document.querySelectorAll('button')].find(x=>/Satélite GOES/.test(x.textContent)).click());
          await new Promise(r=>setTimeout(r,30000));
          await pg.screenshot({path:process.env.GITHUB_WORKSPACE+'/sat_ir.png'});
          await pg.evaluate(()=>[...document.querySelectorAll('button')].find(x=>/^Visível$/.test(x.textContent.trim())).click());
          await new Promise(r=>setTimeout(r,30000));
          await pg.screenshot({path:process.env.GITHUB_WORKSPACE+'/sat_vis.png'});
          require('fs').writeFileSync(process.env.GITHUB_WORKSPACE+'/sat_log.txt',log.join('\n')); await b.close();})();
          JS
          node s.js
      - name: Salvar
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git rm -q --cached -r src || true
          git add -f diag3.txt sat_ir.png sat_vis.png radar_dark.png sat_log.txt; git commit -m "diag3 [skip ci]"; git push
